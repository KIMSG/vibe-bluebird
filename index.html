<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 생존 진단기</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gothic+A1:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    /* 클린 다크 + 앰버 액센트 */
    --bg:        #14110b;
    --bg-2:      #1c1810;
    --paper:     #f5efe0;
    --paper-2:   #d8d0bd;
    --ink:       #14110b;
    --ink-soft:  #4a4030;
    --warn:      #ffb400;
    --warn-2:    #ffc83d;
    --danger:    #ff7a2e;
    --danger-2:  #ff4f1a;
    --crit:      #e63b2e;
    --safe:      #3fb96b;
    --line:      rgba(245,239,224,.12);
    --grid:      rgba(245,239,224,.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--paper);font-family:'Gothic A1', system-ui, sans-serif;}
  body{
    min-height:100vh;
    background: var(--bg);
    overflow-x:hidden;
  }
  #app{min-height:100vh;}
  .mono{font-family:'JetBrains Mono', ui-monospace, monospace;}
  .hand{font-family:'Gaegu', cursive;}
  ::selection{background:var(--warn);color:var(--ink);}

  /* 노이즈 삭제 (클린하게) */
  .grid-bg{
    position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 64px 64px, 64px 64px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 85%);
  }

  /* 공통 버튼 */
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:13px 22px; border-radius:10px;
    border:1px solid transparent; background:var(--warn);
    color:var(--ink); font-weight:700; font-size:14px; letter-spacing:-.01em;
    cursor:pointer; transition: background .15s ease, transform .1s ease, border-color .15s;
    font-family:'Gothic A1', sans-serif;
  }
  .btn:hover{ background:var(--warn-2); }
  .btn:active{ transform: translateY(1px); }
  .btn.danger{ background:var(--danger); color:#fff; }
  .btn.danger:hover{ background:var(--danger-2); }
  .btn.ghost{ background:transparent; color:var(--paper); border-color:var(--line);}
  .btn.ghost:hover{ background:rgba(245,239,224,.06); border-color:var(--paper-2);}
  .btn[disabled]{opacity:.4; cursor:not-allowed;}

  /* 스탬프 */
  .stamp{
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 14px; border-radius:4px;
    border:2px solid currentColor; font-weight:800; letter-spacing:.06em;
    text-transform:uppercase; font-size:11px;
    transform: rotate(-3deg);
  }

  /* 위험 줄무늬 */
  .hazard{
    background: repeating-linear-gradient(45deg, #1a1308 0 14px, var(--warn) 14px 28px);
  }

  @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
  .cursor{ display:inline-block; width:.6ch; background:var(--warn); animation: blink 1s steps(1) infinite; }

  @keyframes shake { 0%,100%{transform:translate(0,0);} 25%{transform:translate(-1px,1px);} 50%{transform:translate(1px,-1px);} 75%{transform:translate(-1px,-1px);} }
  .shake{ animation: shake .25s linear infinite; }

  @keyframes scanline {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }

  /* RPG 스킬트리 */
  .node{ transition: filter .15s, transform .15s; cursor:pointer; }
  .node:hover{ filter: brightness(1.15); transform: scale(1.04); }

  /* 입력 영역 */
  textarea.diag{
    width:100%; min-height:200px;
    background:rgba(245,239,224,.03);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 24px;
    color:var(--paper); font-size:17px; line-height:1.6;
    font-family:'Gothic A1', sans-serif;
    resize:vertical; outline:none;
    transition: border-color .2s, background .2s;
  }
  textarea.diag:focus{ border-color:var(--warn); background:rgba(245,239,224,.05); }
  textarea.diag::placeholder{ color: rgba(245,239,224,.32); }

  .chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:999px;
    border:1px dashed rgba(255,180,0,.45); color:var(--paper-2);
    font-size:13px; cursor:pointer; background:transparent;
    transition: all .15s; font-family:'Gothic A1', sans-serif;
  }
  .chip:hover{ background:rgba(255,180,0,.12); border-style:solid; border-color:var(--warn); color:var(--warn-2); }

  /* 라벨 */
  .label-tag{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px; border:1px solid var(--warn); border-radius:4px;
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.1em;
    color:var(--warn); text-transform:uppercase;
  }

  /* 결과 카드 공통 */
  .panel{
    background:rgba(245,239,224,.025);
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px;
  }
  .panel.paper{ background:var(--paper); color:var(--ink); border-color:var(--ink); }

  /* 스크롤바 */
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background: transparent;}
  ::-webkit-scrollbar-thumb{ background: rgba(255,180,0,.25); border-radius:10px;}
  ::-webkit-scrollbar-thumb:hover{ background: rgba(255,180,0,.5);}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</body>
</html>
